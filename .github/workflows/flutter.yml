name: Flutter

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-demo:
    name: Analyze, test and build Android demo
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out Aule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false
      - name: Check out Flutter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: refs/tags/3.47.7
          path: flutter
          persist-credentials: false
      - name: Verify the Flutter SDK
        run: |
          test "$(git -C ../flutter rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked packages
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: dart analyze
      - name: Test Flutter
        run: flutter test --no-pub
      - name: Prepare Android
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"'
      - name: Build the offline demo APK
        run: flutter build apk --debug --no-pub --target-platform=android-arm64 --dart-define=AULE_DEMO=true
      - name: Save the test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aule-family-demo-arm64-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build the unsigned demo app bundle
        run: flutter build appbundle --release --no-pub --dart-define=AULE_DEMO=true
      - name: Verify the app bundle is unsigned
        run: |
          bundle=build/app/outputs/bundle/release/app-release.aab
          jar tf "$bundle" > "$RUNNER_TEMP/aule-bundle-entries"
          grep -Fxq 'BundleConfig.pb' "$RUNNER_TEMP/aule-bundle-entries"
          if grep -Eiq '^META-INF/[^/]+\.(SF|RSA|DSA|EC)$' "$RUNNER_TEMP/aule-bundle-entries"; then
            echo "The demo bundle already contains a signing identity." >&2
            exit 1
          fi
      - name: Save the unsigned test bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aule-family-demo-release-unsigned
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
